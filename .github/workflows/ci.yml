name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall apps core cell_host db tests
      - name: Compile Firecracker guest agent
        run: cargo check --manifest-path microvm_guest/Cargo.toml
      - name: Test
        env:
          SECRET_KEY: ci-test-only-not-a-secret
        run: python -m pytest -q
