name: Predator Self-Hosted Preflight

on:
  push:
    branches: [feat/sovereign-consequence-authority]
  workflow_dispatch:

jobs:
  substrate-preflight:
    runs-on: [self-hosted, Windows, X64, veklom-predator]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preflight dependency
        run: python -m pip install httpx==0.27.0
      - name: Secret-safe substrate preflight
        env:
          LOCKERPHYCER_CELL_HOST_URL: http://127.0.0.1:8765
          PGL_BASE_URL: http://127.0.0.1:8001
          LOCKERPHYCER_CELL_HOST_API_KEY: ${{ secrets.LOCKERPHYCER_CELL_HOST_API_KEY }}
          CAPPO_AUTHORITY_PUBLIC_KEYS: ${{ secrets.CAPPO_AUTHORITY_PUBLIC_KEYS }}
          PGL_API_KEY: ${{ secrets.PGL_API_KEY }}
          PGL_AGENT_ID: ${{ secrets.PGL_AGENT_ID }}
          GITHUB_APP_ID: ${{ secrets.PREDATOR_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.PREDATOR_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_INSTALLATION_ID: ${{ secrets.PREDATOR_GITHUB_INSTALLATION_ID }}
        run: python scripts/self_hosted_predator_preflight.py
